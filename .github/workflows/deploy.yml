name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages and to verify the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; newer pushes cancel queued runs but not a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Render check (all routes)
        run: npm run check:render

      - name: Build for the project subpath
        # Set PAGES_BASE here if the repository is ever renamed.
        env:
          GITHUB_PAGES: 'true'
          PAGES_BASE: /MAISON-V-RANE/
        run: npm run build

      - name: Write 404.html handover and .nojekyll
        env:
          PAGES_BASE: /MAISON-V-RANE/
        run: node scripts/make-pages-404.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
